<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Offline View - Web Data Scanner</title>
        <link rel="stylesheet" href="./offline.css" />
    </head>
    <body>
        <main class="page">
            <header class="page-header">
                <div>
                    <div class="eyebrow">OFFLINE VIEW</div>
                    <h1 id="title">Loading saved data...</h1>
                    <div id="meta" class="meta"></div>
                </div>
                <div class="header-actions">
                    <button id="back" class="button secondary">
                        Back to Manager
                    </button>
                    <button id="bookmarkPage" class="button secondary" disabled>
                        ☆ Bookmark
                    </button>
                    <button id="openOriginal" class="button secondary" disabled>
                        Open Original
                    </button>
                </div>
            </header>

            <div id="status" class="status"></div>

            <nav
                class="page-navigation card"
                aria-label="Offline page navigation"
            >
                <button id="previousPage" class="button secondary" disabled>
                    ← Previous Page
                </button>
                <div class="navigation-center">
                    <strong>Offline Pages</strong>
                    <span id="navigationInfo">Loading related pages...</span>
                </div>
                <button id="nextPage" class="button" disabled>
                    Next Page →
                </button>
                <div class="navigation-jump">
                    <label for="pageSelect">Page</label>
                    <select id="pageSelect" disabled>
                        <option value="">Loading...</option>
                    </select>
                </div>
                <label class="navigation-filter">
                    <span>Filter</span>
                    <select id="navigationFilter">
                        <option value="same-group" selected>Same story / group</option>
                        <option value="same-domain">Same domain</option>
                        <option value="same-domain-group">
                            Same domain + same story / group
                        </option>
                        <option value="same-domain-scan-type">
                            Same domain + same scan type
                        </option>
                        <option value="all">All saved pages</option>
                    </select>
                </label>
            </nav>

            <section id="contentCard" class="card hidden">
                <div class="card-header">
                    <div>
                        <h2>Rendered Content</h2>
                        <p>
                            Text is shown as preformatted content. HTML fields
                            are rendered with their saved markup and embedded
                            styles.
                        </p>
                    </div>
                    <button id="copyContent" class="button secondary">
                        Copy Content
                    </button>
                </div>
                <div id="renderedFields" class="rendered-fields"></div>
            </section>

            <section id="dataCard" class="card hidden">
                <div class="card-header">
                    <div>
                        <h2>Saved JSON</h2>
                        <p>The complete scan result stored in the database.</p>
                    </div>
                    <button id="copyJson" class="button secondary">
                        Copy JSON
                    </button>
                </div>
                <pre id="json" class="json"></pre>
            </section>
        </main>

        <script type="module" src="./offline.js"></script>
    </body>
</html>
