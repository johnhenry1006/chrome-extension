<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Web Data Scanner</title>
        <link rel="stylesheet" href="./popup.css" />
    </head>
    <body>
        <main class="app">
            <header>
                <h1>Web Data Scanner</h1>
                <p>Scan a page and save the result to SQLite.</p>
            </header>

            <label>Name</label>
            <input id="name" value="Chapter Content" />

            <label>Mode</label>
            <select id="mode">
                <option value="single">Single</option>
                <option value="list">List</option>
            </select>

            <label>Selector</label>
            <input id="selector" value="#chapter-c" />

            <section class="group-config">
                <div class="field-header">
                    <div class="field-title">
                        <label for="groupType">Group / Story</label>
                        <span id="groupHint"
                            >Optional. Use this to identify pages that belong to
                            the same story.</span
                        >
                    </div>
                </div>

                <select id="groupType">
                    <option value="none">None</option>
                    <option value="selector">Text from selector</option>
                    <option value="meta">Meta tag content</option>
                    <option value="url-pattern">URL pattern</option>
                    <option value="constant" selected>Constant value</option>
                    <option value="field">Extracted field</option>
                </select>

                <div id="groupSelectorRow" class="group-input-row">
                    <label id="groupSelectorLabel">Story name selector</label>
                    <input
                        id="groupSelector"
                        value=".story-title"
                        placeholder=".story-title"
                    />
                </div>

                <div id="groupAttributeRow" class="group-input-row hidden">
                    <label>Attribute (optional)</label>
                    <input id="groupAttribute" placeholder="data-story-name" />
                </div>

                <div id="groupPatternRow" class="group-input-row hidden">
                    <label>Regex pattern</label>
                    <input
                        id="groupPattern"
                        placeholder="/story/([^/]+)/chapter/"
                    />
                    <small
                        >Use the first capture group as the story name.</small
                    >
                </div>

                <div id="groupValueRow" class="group-input-row hidden">
                    <label>Group value</label>
                    <input id="groupValue" placeholder="My Story" />
                </div>

                <div id="groupFieldRow" class="group-input-row hidden">
                    <label>Extracted field name</label>
                    <input id="groupField" placeholder="storyName" />
                    <small
                        >Uses a field from the scan result, e.g.
                        <code>storyName</code>.</small
                    >
                </div>
            </section>

            <div class="field-header">
                <div class="field-title">
                    <label for="fields">Fields JSON</label>
                    <span id="fieldsHint"
                        >Uses the sample for the selected mode.</span
                    >
                </div>
                <button
                    id="resetFields"
                    class="secondary-button"
                    type="button"
                    hidden
                >
                    Reset Fields Sample
                </button>
            </div>
            <textarea id="fields" rows="10">
{
  "content": {
    "type": "html"
  }
}</textarea
            >

            <div class="actions">
                <button id="scan">Scan &amp; Save</button>
                <button id="ping">Test SQLite</button>
            </div>

            <div class="actions">
                <button id="viewSaved">View Saved Data</button>
                <button id="manageSaved">Manage Saved Data</button>
                <button id="manageStories">Stories / Groups</button>
                <button id="copyResult">Copy Result</button>
                <button id="copyConfig">Copy Config</button>
            </div>

            <div id="status" class="status"></div>
            <pre id="output"></pre>
        </main>

        <script type="module" src="./popup.js"></script>
    </body>
</html>
